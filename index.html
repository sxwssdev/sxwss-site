<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sxwss.gg</title>
<link rel="icon" href="data:,">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

/* 🎬 DESKTOP VIDEO */
video{
    position:fixed;
    top:50%;
    left:50%;
    min-width:100%;
    min-height:100%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:grayscale(100%) brightness(0.35) contrast(1.1);
    z-index:-3;
}

/* 📱 MOBILE IMAGE */
.mobile-bg{
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:url("background.jpg") center center / cover no-repeat;
    filter:grayscale(100%) brightness(0.35) contrast(1.1);
    z-index:-3;
}

/* DARK OVERLAY */
.dark{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* CLOCK */
.clock{
    position:fixed;
    top:18px;
    right:28px;
    font-size:14px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.55);
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    padding:6px 14px;
    backdrop-filter:blur(10px);
    border-radius:8px;
    user-select:none;
}

/* CENTER */
.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* BUTTON */
.enter{
    padding:24px 90px;
    font-size:36px;
    letter-spacing:10px;
    color:white;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(14px);
    cursor:pointer;
    transition:0.35s ease;
}

.enter:hover{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 0 60px rgba(255,255,255,0.2);
    transform:scale(1.06);
}

/* MENU */
.menuOverlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(50px) saturate(130%);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
}

.menuOverlay.active{
    opacity:1;
    pointer-events:all;
}

.menu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.9);
    text-align:center;
    opacity:0;
    transition:0.5s ease;
}

.menuOverlay.active .menu{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
}

.menu a{
    display:block;
    font-size:42px;
    margin:30px 0;
    color:white;
    text-decoration:none;
    letter-spacing:10px;
    transition:0.3s ease;
    opacity:0.85;
}

.menu a:hover{
    transform:scale(1.12);
    letter-spacing:16px;
    opacity:1;
}

.footer{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    letter-spacing:4px;
    color:rgba(255,255,255,0.35);
    user-select:none;
    pointer-events:none;
}

/* 📱 RESPONSIVE SWITCH */
@media (max-width: 768px){

    video{
        display:none;
    }

    .mobile-bg{
        display:block;
    }

    .enter{
        padding:18px 50px;
        font-size:26px;
        letter-spacing:8px;
    }

    .menu a{
        font-size:28px;
        letter-spacing:6px;
    }

    .clock{
        font-size:12px;
        padding:4px 10px;
    }
}
</style>
</head>
<body>

<!-- DESKTOP VIDEO -->
<video autoplay muted loop playsinline preload="none">
    <source src="background.mp4" type="video/mp4">
</video>

<!-- MOBILE IMAGE -->
<div class="mobile-bg"></div>

<div class="dark"></div>

<div class="clock" id="clock">00:00</div>

<div class="center">
    <button class="enter" onclick="openMenu()">SXWSS</button>
</div>

<div class="menuOverlay" id="menuOverlay">
    <div class="menu">
        <a href="https://www.tiktok.com/@sxwss_" target="_blank">TIKTOK</a>
        <a href="https://www.instagram.com/brenooo1_/" target="_blank">INSTAGRAM</a>
        <a href="https://discord.com/users/1094196936233472066" target="_blank">DISCORD</a>
    </div>
</div>

<div class="footer">
    made with ♡ by sxwss
</div>

<audio id="music" preload="auto" loop>
    <source src="background.mp3" type="audio/mpeg">
</audio>

<script>
const overlay = document.getElementById("menuOverlay");
const clock = document.getElementById("clock");
const music = document.getElementById("music");

let musicStarted = false;

/* CLOCK */
function updateClock(){
    const now = new Date();
    clock.textContent =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');
}
setInterval(updateClock, 1000);
updateClock();

/* MUSIC */
function startMusic(){
    if(!musicStarted){
        music.volume = 1;
        music.play().then(()=>{
            musicStarted = true;
        }).catch(()=>{});
    }
}

document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);

window.addEventListener("load", startMusic);

/* MENU */
function openMenu(){
    overlay.classList.add("active");
    startMusic();
}

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
        overlay.classList.remove("active");
    }
});

/* TAB TITLE LOOP */
const titles = ["sxwss.html","sxwss.bat","sxwss.exe"];
let titleIndex = 0;
let titleInterval;

function startTitleLoop(){
    titleInterval = setInterval(()=>{
        titleIndex = (titleIndex + 1) % titles.length;
        document.title = titles[titleIndex];
    },300);
}

document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
        clearInterval(titleInterval);
        document.title = "come back.";
    } else {
        startTitleLoop();
    }
});

startTitleLoop();
</script>

</body>
</html>
