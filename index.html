<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sxwss.gg</title>
<link rel="icon" href="data:,">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
body{overflow:hidden;background:black;}

/* VIDEO */
video{
    position:fixed;
    top:50%;left:50%;
    min-width:100%;min-height:100%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:grayscale(100%) brightness(0.35) contrast(1.1);
    z-index:-3;
}

/* MOBILE IMAGE */
.mobile-bg{
    display:none;
    position:fixed;
    width:100%;height:100%;
    background:url("background.jpg") center center / cover no-repeat;
    filter:grayscale(100%) brightness(0.35) contrast(1.1);
    z-index:-3;
}

.dark{
    position:fixed;
    width:100%;height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* CLOCK */
.clock{
    position:fixed;
    top:18px;right:28px;
    font-size:13px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.55);
}

/* DISCORD */
.discordStatus{
    position:fixed;
    bottom:48px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:4px;
    color:rgba(255,255,255,0.75);
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:8px;height:8px;
    border-radius:50%;
    background:gray;
    box-shadow:0 0 8px gray;
}

@keyframes pulse{
    0%{box-shadow:0 0 4px currentColor;}
    50%{box-shadow:0 0 16px currentColor;}
    100%{box-shadow:0 0 4px currentColor;}
}

/* CENTER */
.center{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
}

.enter{
    padding:24px 90px;
    font-size:36px;
    letter-spacing:10px;
    color:white;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(14px);
    cursor:pointer;
    transition:0.35s ease;
}

.enter:hover{transform:scale(1.06);}

/* MENU */
.menuOverlay{
    position:fixed;
    width:100%;height:100%;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(50px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
}

.menuOverlay.active{
    opacity:1;
    pointer-events:all;
}

.menu{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.menu a{
    display:block;
    font-size:42px;
    margin:30px 0;
    color:white;
    text-decoration:none;
    letter-spacing:10px;
    transition:0.3s ease;
}

.menu a:hover{transform:scale(1.12);}

/* FOOTER */
.footer{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    letter-spacing:4px;
    color:rgba(255,255,255,0.35);
}

@media (max-width:768px){
    video{display:none;}
    .mobile-bg{display:block;}
}
</style>
</head>
<body>

<video autoplay muted loop playsinline preload="none">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="mobile-bg"></div>
<div class="dark"></div>

<div class="clock" id="clock">00:00</div>

<div class="center">
    <button class="enter" onclick="openMenu()">SXWSS</button>
</div>

<div class="menuOverlay" id="menuOverlay">
    <div class="menu">
        <a href="https://www.tiktok.com/@sxwss_" target="_blank">TIKTOK</a>
        <a href="https://www.instagram.com/brenooo1_/" target="_blank">INSTAGRAM</a>
        <a href="https://discord.com/users/1094196936233472066" target="_blank">DISCORD</a>
    </div>
</div>

<div class="discordStatus">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">DISCORD - LOADING</span>
</div>

<div class="footer">
    made with ♡ by sxwss
</div>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" loop preload="auto">
    <source src="background.mp3" type="audio/mpeg">
</audio>

<script>
const overlay=document.getElementById("menuOverlay");
const clock=document.getElementById("clock");
const music=document.getElementById("bgMusic");

/* CLOCK */
function updateClock(){
    const now=new Date();
    clock.textContent=
        now.getHours().toString().padStart(2,'0')+":"+
        now.getMinutes().toString().padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* MENU */
function openMenu(){
    overlay.classList.add("active");
}
document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"){
        overlay.classList.remove("active");
    }
});

/* 🔥 MUSIC SYSTEM */
function tryAutoPlay(){
    music.volume=1;
    music.play().catch(()=>{});
}

window.addEventListener("load", tryAutoPlay);

// HA BLOKKOLJA → BÁRHOL KATTINTASZ ELINDUL
function forcePlay(){
    music.play();
    document.removeEventListener("click", forcePlay);
    document.removeEventListener("touchstart", forcePlay);
}

document.addEventListener("click", forcePlay);
document.addEventListener("touchstart", forcePlay);

/* DISCORD */
async function getDiscordStatus(){
    const res=await fetch("https://api.lanyard.rest/v1/users/1094196936233472066");
    const data=await res.json();

    const status=data.data.discord_status;
    const text=document.getElementById("statusText");
    const dot=document.getElementById("statusDot");

    dot.style.animation="none";

    if(status==="online"){
        text.textContent="DISCORD - ONLINE";
        dot.style.background="#43b581";
        dot.style.animation="pulse 2s infinite";
    }
    else if(status==="idle"){
        text.textContent="DISCORD - IDLE";
        dot.style.background="#faa61a";
    }
    else if(status==="dnd"){
        text.textContent="DISCORD - DND";
        dot.style.background="#f04747";
    }
    else{
        text.textContent="DISCORD - OFFLINE";
        dot.style.background="#747f8d";
    }
}

getDiscordStatus();
setInterval(getDiscordStatus,15000);
</script>

</body>
</html>
