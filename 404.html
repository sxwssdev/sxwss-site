<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Lost in orbit · sxwss</title>
  <link rel="icon" type="image/svg+xml" href="/planet.svg">
  <style>
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #08090b url("/orbit-nebula.webp") center / cover no-repeat;
      color: #f2f2ee;
      text-align: center;
      font-family: "Arial Black", Arial, sans-serif;
    }
    #space { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none }
    main { position: relative }
    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .04em;
      font-size: clamp(90px, 19vw, 210px);
      font-style: italic;
      font-weight: 900;
      line-height: .95;
    }
    .code img { width: 1.05em; height: .88em; margin-inline-end: -.18em }
    h1 { margin: 20px 0; font-size: clamp(28px, 5vw, 50px); font-style: italic; letter-spacing: -.065em }
    a {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      color: #d1d3d6;
      font: italic 900 clamp(17px, 1.5vw, 21px)/1 "Arial Black",Arial,sans-serif;
      letter-spacing: -.055em;
      text-decoration: none;
    }
    a:hover { color: white }
    a svg { width: .85em; height: .85em; fill: currentColor }
    @media (prefers-reduced-motion: no-preference) {
      a svg { transition: transform .2s ease }
      a:is(:hover,:focus-visible) svg { transform: translateX(-3px) }
    }
    a:focus-visible { outline: 2px solid white; outline-offset: 4px }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <main>
    <div class="code" aria-hidden="true">4<img src="/planet.svg" alt="">4</div>
    <h1 aria-label="404 — Lost in orbit">Lost in orbit</h1>
    <a id="back-home" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(24 0) scale(-1 1)" d="M3 3h18l-4 16h-5l2-8-11 11-3-4L12 7H2z"/></svg>Back home</a>
  </main>
  <script>
    const homeLink = document.getElementById('back-home');
    const clip = new Audio('/back-home.mp3');
    clip.preload = 'auto';
    homeLink.addEventListener('click', event => {
      if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (homeLink.hasAttribute('aria-busy')) return;
      homeLink.setAttribute('aria-busy', 'true');
      const goHome = () => {
        if (!homeLink.hasAttribute('aria-busy')) return;
        clearTimeout(timeout);
        homeLink.removeAttribute('aria-busy');
        location.assign(homeLink.href);
      };
      const timeout = setTimeout(goHome, 8000);
      clip.onended = goHome;
      clip.onerror = goHome;
      clip.play().catch(goHome);
    });

    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const stars = Array.from({ length: 420 }, () => ({
      x: Math.random(), y: Math.random(), depth: Math.random() ** 2,
      phase: Math.random() * Math.PI * 2
    }));
    let width, height, count, frame, last = 0, elapsed = 0;

    function paint(t) {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#dce7ff';
      for (let i = 0; i < count; i++) {
        const star = stars[i];
        const speed = 1 + star.depth * 4;
        const x = (star.x * width + t * speed) % width;
        const y = (star.y * height + t * speed * .24) % height;
        const radius = .35 + star.depth * .85;
        ctx.globalAlpha = .28 + star.depth * .46 + .12 * Math.sin(t * .7 + star.phase);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, 2 * Math.PI);
        ctx.fill();
        if (star.depth > .96) {
          ctx.fillRect(x - 3, y - .4, 6, .8);
          ctx.fillRect(x - .4, y - 3, .8, 6);
        }
      }
      const pass = (t + 11) % 17;
      if (!reduced.matches && pass < 1.15) {
        const x = width * .53 + pass * 180;
        const y = height * .12 + pass * 72;
        const tail = ctx.createLinearGradient(x - 90, y - 36, x, y);
        tail.addColorStop(0, 'transparent');
        tail.addColorStop(1, '#e5edff');
        ctx.globalAlpha = .7 * Math.sin(Math.PI * pass / 1.15);
        ctx.strokeStyle = tail;
        ctx.beginPath();
        ctx.moveTo(x - 90, y - 36);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    function animate(now) {
      if (now - last >= 32) {
        elapsed += Math.min((now - last) / 1000, .1);
        last = now;
        paint(elapsed);
      }
      frame = requestAnimationFrame(animate);
    }
    function refresh() {
      cancelAnimationFrame(frame);
      if (document.hidden || !ctx) return;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      const scale = Math.min(devicePixelRatio, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      count = Math.min(stars.length, Math.ceil(width * height / 3600));
      paint(elapsed);
      last = performance.now();
      if (!reduced.matches) frame = requestAnimationFrame(animate);
    }
    addEventListener('resize', refresh);
    document.addEventListener('visibilitychange', refresh);
    reduced.addEventListener('change', refresh);
    refresh();
  </script>
</body>
</html>
